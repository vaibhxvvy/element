[package]
name = "element"
version = "1.1.0"
edition = "2021"
description = "A fast local launcher and search tool for Windows."

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
emojis = "0.6"
evalexpr = "11"
webbrowser = "1.0"
arboard = "3.3"
walkdir = "2"
image = "0.25"
thiserror = "1"
iced = { version = "0.13", default-features = false, features = ["wgpu", "system", "image", "tokio"] }

[build-dependencies]
embed-resource = "3"
